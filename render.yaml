# Render Blueprint for the MoviQ backend (Express + Socket.IO).
# In Render: New + -> Blueprint -> pick this GitHub repo. Render reads this file.
# Values marked `sync: false` are entered by you in the Render dashboard (never committed).
services:
  - type: web
    name: moviq-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/moviq
      - key: MONGO_URI
        sync: false
      # Never start a local mongod in production
      - key: MONGO_FALLBACK
        value: "false"
      # Fresh random secret generated by Render (do NOT reuse the local development secret)
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel site URL, e.g. https://moviq.vercel.app (used for CORS + Socket.IO)
      - key: CLIENT_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      # Skip downloading the local MongoDB binary used only for development
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # Optional features
      - key: TMDB_READ_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
